name: CI

# Phase 0 (Consumer Slicer Plan §16): the app's own JVM/Kotlin gate (lint, unit tests, an
# assembled debug build) plus the real native slicing-engine build (nozzle-engine,
# engine/fork/android/ci_engine_root.sh, over the runner's prebuilt NDK dependency prefix). Runs on a self-hosted runner
# (gthost-build01) with that dependency pre-provisioned, per the owner's decision (§22 open
# question 5) - a hosted GitHub runner cannot build this target at all.
#
# The AWS Device Farm instrumented-test stage (owner-confirmed access, real device/OS
# fragmentation coverage this app has never had) runs against the real "Nozzle It All" Device
# Farm project (console-created, project ARN below). Needs AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY as repo secrets (a narrowly-scoped IAM user, devicefarm run/upload/read
# actions only - see docs/WORK_ORDER.md's Phase 0 entry for how these were created).
#
# Cost control (owner decision, 2026-09-22, after the first real runs against the 1000-minute
# free trial): device-farm is manual-only (workflow_dispatch), not triggered on every push -
# device-minutes are billed per device, so a run against every commit would burn the trial (and
# real money after it) on intermediate work, not just the checkpoints that matter. Trigger it
# explicitly (`gh workflow run ci.yml`, or the Actions tab's "Run workflow" button) when you
# actually want real-device coverage. build-and-test still runs on every push - it costs nothing
# beyond this self-hosted runner's own time.
#
# Also uses `ci-small-pool` (3 devices: a recent Pixel, a recent Galaxy, a Pixel Tablet - real
# device ARNs, not placeholders), not the curated "Top Devices" pool (5 devices) the first runs
# used - roughly 40% fewer device-minutes per run for routine use, at the cost of less breadth
# per run. Device Farm bills per device-minute, summed across every device in the pool, not per
# run - see WORK_ORDER.md for the actual first-run costs this was based on.

on:
  push:
    branches: [codex/android-mvp, main]
    tags: ['v*']
  pull_request:
    branches: [codex/android-mvp, main]
  workflow_dispatch:
    inputs:
      device_pool_arn:
        description: "Device Farm pool ARN (blank = ci-small-pool). The curated Top Devices pool that produced the Sept 22 runs is arn:aws:devicefarm:us-west-2::devicepool:082d10e5-d7d7-48a5-ba5c-b33d66efa1f5"
        required: false
        default: ""
      app_upload_arn:
        description: "Reuse this existing Device Farm app upload instead of uploading the built APK (blank = upload). For isolating signing problems."
        required: false
        default: ""
      test_filter:
        description: "Device Farm instrumentation filter (e.g. a fully qualified test class) to run only part of the suite (blank = everything)."
        required: false
        default: ""
      test_upload_arn:
        description: "Reuse this existing Device Farm test-package upload instead of uploading the built one (blank = upload)."
        required: false
        default: ""

jobs:
  build-and-test:
    # A self-hosted runner executes whatever the branch contains, so a pull request from a fork must never run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, android-native]
    timeout-minutes: 60
    env:
      ANDROID_DEPS_PREFIX: /home/jjennison/orcaslicer-android-engine/deps/install/arm64-v8a
      NOZZLE_ENGINE_CACHE: /home/jjennison/nozzle-engine-ci
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      - uses: actions/checkout@v4

      # The engine is nozzle-engine at the pinned commit (engine/fork/ENGINE_PIN.json, docs/upstream/PROVENANCE.md P-0020,
      # P-0021), fetched and prepared in a cache that survives runs.
      - name: Prepare slicing engine (pinned)
        run: |
          root="$(engine/fork/android/ci_engine_root.sh "$NOZZLE_ENGINE_CACHE" "$ANDROID_DEPS_PREFIX")"
          echo "ORCASLICER_ENGINE_ROOT=${root##*$'\n'}" >> "$GITHUB_ENV"

      # The static website (site/) is generated from site-src/; fail if they drift or a release-state rule is broken.
      - name: Check website build
        run: python3 scripts/build_site.py --check

      - name: Unit tests + lint
        run: ./gradlew testDebugUnitTest lintDebug :domain:check :transport:check --no-daemon

      - name: Assemble debug (native build, arm64-v8a)
        # -PdeviceFarmTests leaves out the LAN/printer-only tests: Device Farm rejects (at re-signing) a test package with too much code.
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon -PdeviceFarmTests

      - name: Upload lint/test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      # Staged into a flat directory rather than passing both paths straight to
      # upload-artifact: that preserves each file's full relative path from the repo root
      # instead of flattening, which would leave the device-farm job guessing at the nested
      # download layout.
      - name: Stage APKs for upload
        run: |
          mkdir -p apk-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk apk-artifacts/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apk-artifacts/
          # Device Farm rejects (at re-signing) a run of this test package once it holds a few hundred tests (the 144-test package of Sept 22 signed;
          # the 308-test one does not, filtered or not), but accepts smaller runs. So the suite is split into balanced shards, each its own run.
          python3 - <<'PYEOF'
          import re, pathlib
          skip = {"ActiveToolDeviceTest", "AddPrinterWizardDeviceTest", "FakeBambuDeviceTest", "LiveFileHardwareTest", "LivePreviewHardwareTest",
                  "LivePrinterReadOnlyTest", "MmfLiveDeviceTest", "OctoPrintDeviceTest", "PrinterScanDeviceTest", "SshHostKeyPinDeviceTest"}
          root = pathlib.Path("app/src/androidTest/java")
          weight = {}
          for f in sorted(root.rglob("*.kt")):
              text = f.read_text()
              pkg = re.search(r"^package\s+([\w.]+)", text, re.M).group(1)
              classes = re.findall(r"^(?:internal\s+|private\s+|public\s+)?class\s+(\w+)", text, re.M)
              if "@Test" in text and len(classes) == 1 and classes[0] not in skip:
                  weight[pkg + "." + classes[0]] = text.count("@Test")
              elif "@Test" in text:
                  for cls in classes:
                      if cls not in skip: weight[pkg + "." + cls] = max(1, text.count("@Test") // len(classes))
          shards = [[] for _ in range(4)]
          load = [0] * 4
          for name, w in sorted(weight.items(), key=lambda kv: -kv[1]):
              i = load.index(min(load)); shards[i].append(name); load[i] += w
          for i, names in enumerate(shards, 1):
              pathlib.Path(f"apk-artifacts/test-shard-{i}.txt").write_text(",".join(sorted(names)))
          print(sum(load), "tests in", len(weight), "classes; shard loads", load)
          PYEOF

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-artifacts/
          retention-days: 14

  device-farm:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, android-native]
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      # Registers the account number as a secret so GitHub masks it anywhere it is printed (the ARNs below contain it and this repo is public).
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      PROJECT_ARN: ${{ vars.DEVICE_FARM_PROJECT_ARN }}
      APP_UPLOAD_ARN: ${{ inputs.app_upload_arn }}
      TEST_UPLOAD_ARN: ${{ inputs.test_upload_arn }}
      TEST_FILTER: ${{ inputs.test_filter }}
      DEVICE_POOL_ARN: ${{ inputs.device_pool_arn || vars.DEVICE_FARM_POOL_ARN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apks

      # Uploads both APKs, waits for Device Farm to finish processing each (SUCCEEDED/FAILED),
      # schedules an INSTRUMENTATION run against the real device pool above, then polls until the
      # run completes and fails the job on anything other than PASSED - a real gate, not just a
      # kick-off. jq is used throughout since Device Farm's CLI output has no simpler shape for
      # the specific fields needed (upload/run ARNs, statuses, per-device results).
      - name: Upload app + test package, schedule and wait for the Device Farm run
        run: |
          set -euo pipefail

          upload_and_wait() {
            local file="$1" type="$2" name
            name=$(basename "$file")
            local upload_json upload_arn upload_url
            upload_json=$(aws devicefarm create-upload --project-arn "$PROJECT_ARN" --name "$name" --type "$type")
            upload_arn=$(echo "$upload_json" | jq -r '.upload.arn')
            upload_url=$(echo "$upload_json" | jq -r '.upload.url')
            curl -sS -T "$file" "$upload_url"
            for _ in $(seq 1 30); do
              status=$(aws devicefarm get-upload --arn "$upload_arn" | jq -r '.upload.status')
              if [ "$status" = "SUCCEEDED" ]; then echo "$upload_arn"; return 0; fi
              if [ "$status" = "FAILED" ]; then echo "::error::Upload $name failed processing" >&2; exit 1; fi
              sleep 10
            done
            echo "::error::Upload $name never reached SUCCEEDED" >&2
            exit 1
          }

          app_arn="${APP_UPLOAD_ARN:-}"
          [ -n "$app_arn" ] || app_arn=$(upload_and_wait apks/app-debug.apk ANDROID_APP)
          test_arn="${TEST_UPLOAD_ARN:-}"
          [ -n "$test_arn" ] || test_arn=$(upload_and_wait apks/app-debug-androidTest.apk INSTRUMENTATION_TEST_PACKAGE)
          echo "app upload: $app_arn"; echo "test upload: $test_arn"

          # One run per shard (or the single hand-typed filter). Every shard runs even if an earlier one fails; the job fails at the end.
          filters=()
          if [ -n "${TEST_FILTER:-}" ]; then filters+=("$TEST_FILTER")
          else for f in apks/test-shard-*.txt; do filters+=("$(cat "$f")"); done; fi
          overall=0; n=0
          for filter in "${filters[@]}"; do
            n=$((n+1))
            # JSON, not the CLI shorthand: a filter naming several classes contains commas, which the shorthand would split.
            test_json=$(jq -cn --arg arn "$test_arn" --arg f "$filter" '{type: "INSTRUMENTATION", testPackageArn: $arn} + (if $f == "" then {} else {filter: $f} end)')
            run_json=$(aws devicefarm schedule-run \
              --project-arn "$PROJECT_ARN" \
              --app-arn "$app_arn" \
              --device-pool-arn "$DEVICE_POOL_ARN" \
              --name "ci-${GITHUB_SHA::7}-shard${n}of${#filters[@]}" \
              --test "$test_json")
            run_arn=$(echo "$run_json" | jq -r '.run.arn')
            echo "Device Farm run (shard $n of ${#filters[@]}): https://us-west-2.console.aws.amazon.com/devicefarm/home?region=us-west-2#/mobile/projects/$(basename "$PROJECT_ARN")/runs/$(basename "$run_arn")"
            for _ in $(seq 1 90); do
              run_status=$(aws devicefarm get-run --arn "$run_arn" | jq -r '.run.status')
              if [ "$run_status" = "COMPLETED" ]; then break; fi
              sleep 20
            done
            run_json=$(aws devicefarm get-run --arn "$run_arn")
            result=$(echo "$run_json" | jq -r '.run.result')
            echo "shard $n: $(echo "$run_json" | jq -c '{status: .run.status, result: .run.result, counters: .run.counters, deviceMinutes: .run.deviceMinutes}')"
            if [ "$result" != "PASSED" ]; then
              # Say WHY. The CI user may not be allowed ListJobs, so print what GetRun itself returns (message, device selection, billing).
              echo "$run_json" | jq '{message: .run.message, deviceSelectionResult: .run.deviceSelectionResult, billingMethod: .run.billingMethod, totalJobs: .run.totalJobs, completedJobs: .run.completedJobs}' || true
              echo "::error::Device Farm shard $n result was $result, not PASSED"
              overall=1
            fi
          done
          exit $overall

  # Phase 9g: tagged releases. Builds the minified release APK, signs it when the signing secrets exist (the owner's
  # identity is not in this repo - docs/RELEASE.md), writes the SBOM, and attaches GitHub build-provenance
  # attestations to both. Not exercised yet: it needs a tag push and the secrets on the self-hosted runner.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: [self-hosted, linux, x64, android-native]
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ANDROID_DEPS_PREFIX: /home/jjennison/orcaslicer-android-engine/deps/install/arm64-v8a
      NOZZLE_ENGINE_CACHE: /home/jjennison/nozzle-engine-ci
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      NOZZLE_KEYSTORE_B64: ${{ secrets.NOZZLE_KEYSTORE_B64 }}
      NOZZLE_KEYSTORE_PASSWORD: ${{ secrets.NOZZLE_KEYSTORE_PASSWORD }}
      NOZZLE_KEY_ALIAS: ${{ secrets.NOZZLE_KEY_ALIAS }}
      NOZZLE_KEY_PASSWORD: ${{ secrets.NOZZLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versionCode is the commit count, so it only ever goes up
      - name: Prepare slicing engine (pinned)
        run: |
          root="$(engine/fork/android/ci_engine_root.sh "$NOZZLE_ENGINE_CACHE" "$ANDROID_DEPS_PREFIX")"
          echo "ORCASLICER_ENGINE_ROOT=${root##*$'\n'}" >> "$GITHUB_ENV"
      - name: Decode signing key (if configured)
        run: |
          if [ -n "${NOZZLE_KEYSTORE_B64:-}" ]; then
            echo "$NOZZLE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NOZZLE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::error::No signing key configured - refusing to build and attest an unsigned release."; exit 1
          fi
      - name: Build release APK + Play bundle (AAB) + SBOM
        # Tag vX.Y.Z sets versionName X.Y.Z; versionCode is the commit count (Play needs it to increase on every upload).
        run: |
          ./gradlew assembleRelease bundleRelease generateSbom --no-daemon \
            -PnozzleVersionName="${GITHUB_REF_NAME#v}" -PnozzleVersionCode="$(git rev-list --count HEAD)"
      - name: Stage release files
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/
          cp app/build/outputs/bundle/release/*.aab release-artifacts/
          cp app/build/sbom/nozzle-it-all.cdx.json release-artifacts/
          cp app/build/outputs/mapping/release/mapping.txt release-artifacts/
          (cd release-artifacts && sha256sum * > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/nozzle-it-all.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release-artifacts/
          retention-days: 90
      # A DRAFT release: nothing is public until the owner reviews the notes and presses Publish on GitHub.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Nozzle It All ${GITHUB_REF_NAME#v}" \
            release-artifacts/*.apk release-artifacts/*.aab release-artifacts/SHA256SUMS release-artifacts/nozzle-it-all.cdx.json
      - name: Remove signing key
        if: always()
        run: shred -u "$RUNNER_TEMP/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/release.jks"
