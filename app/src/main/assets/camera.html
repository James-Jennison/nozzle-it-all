<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src __ORIGIN__; media-src blob:;">
<style>html,body{margin:0;background:#10171d;position:fixed;inset:0;overflow:hidden}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}</style></head><body>
<video id="video" autoplay muted playsinline></video><script>
'use strict';
const endpoint=__ENDPOINT__;
const video=document.getElementById('video');
window.cameraStats={frames:0,state:'Connecting'};
let peer=null, timer=null, stopped=false, epoch=0, aborts=new Set();
function cleanup(){epoch++;if(timer)clearTimeout(timer);timer=null;aborts.forEach(c=>c.abort());aborts.clear();if(peer)peer.close();peer=null;if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;}
function retry(){if(stopped)return;cleanup();window.cameraStats.state='Reconnecting';timer=setTimeout(start,3000);}
async function signal(data){const controller=new AbortController();aborts.add(controller);const timeout=setTimeout(()=>controller.abort(),6000);try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal,credentials:'omit',redirect:'error'});if(!r.ok)throw Error('Camera request failed');return await r.json();}finally{clearTimeout(timeout);aborts.delete(controller);}}
async function start(){
 if(stopped)return; cleanup(); const ticket=epoch;window.cameraStats.state='Connecting';
 try{
  const offer=await signal({type:'request',iceServers:[],keepAlive:true});if(stopped||ticket!==epoch)return;
  const pc=new RTCPeerConnection({iceServers:[]});peer=pc;
  const valid=()=>!stopped&&ticket===epoch&&peer===pc;
  pc.ontrack=e=>{if(valid()){video.srcObject=e.streams[0]||new MediaStream([e.track]);video.play().catch(()=>{window.cameraStats.state='Tap to play';});}};
  pc.ondatachannel=e=>{if(e.channel.label==='keepalive')e.channel.onmessage=()=>{if(valid()&&e.channel.readyState==='open')e.channel.send('pong');};};
  pc.onconnectionstatechange=()=>{if(valid()&&['failed','disconnected','closed'].includes(pc.connectionState))retry();};
  pc.onicecandidate=e=>{if(valid()&&e.candidate)signal({type:'remote_candidate',id:offer.id,candidates:[e.candidate]}).catch(()=>{if(valid())retry();});};
  pc.addTransceiver('video',{direction:'recvonly'});
  await pc.setRemoteDescription({type:offer.type,sdp:offer.sdp});if(!valid())return;
  await pc.setLocalDescription(await pc.createAnswer());if(!valid())return;
  await signal({type:pc.localDescription.type,id:offer.id,sdp:pc.localDescription.sdp});
  if(!valid())return;
  let previous=window.cameraStats.frames;
  const watchdog=()=>{if(!valid())return;if(window.cameraStats.frames===previous){retry();return;}previous=window.cameraStats.frames;timer=setTimeout(watchdog,10000);};
  timer=setTimeout(watchdog,10000);
 }catch(e){if(!stopped&&ticket===epoch)retry();}
}
function frame(){if(stopped)return;window.cameraStats.frames++;window.cameraStats.state='Playing';video.requestVideoFrameCallback(frame);}
if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(frame);
else video.ontimeupdate=()=>{window.cameraStats.frames=video.getVideoPlaybackQuality().totalVideoFrames;window.cameraStats.state='Playing';};
window.stopCamera=()=>{stopped=true;cleanup();window.cameraStats.state='Stopped';};
window.addEventListener('pagehide',window.stopCamera);
video.addEventListener('click',()=>video.play());
start();
</script></body></html>
