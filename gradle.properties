org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# connectedDebugAndroidTest silently uninstalls the app-under-test and the test APK from the
# device once the run finishes, unless told not to - this repeatedly wiped the owner's real
# printer profiles off their physical test device mid-session and left the app looking installed
# in this session's own reasoning when it genuinely wasn't (confirmed via dumpsys after the fact,
# more than once). This is the real, permanent fix, not "remember to reinstall after tests."
android.injected.androidTest.leaveApksInstalledAfterRun=true
